<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Digital Presence</title>
    <link rel="preload" href="./css/style.css" as="style">
    <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" as="style">
    <link rel="preload" href="./js/script.js" as="script">
    <link rel="icon" href="./Images/Deagle.png">
    <link rel="apple-touch-icon" href="./Images/Deagle.png">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/mobile.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
    <script src="./js/script.js" defer></script>

</head>
<body>
    <!--Welcome Overlay-->
    <div class="welcome-overlay">
        <div class="welcome-content">
            <button class="welcome-button" title="Enter">Click to reveal</button>
        </div>
    </div>

    <!--Core app -->
    <div class="app">
        <!--Header-->
        <div class="header">
            <!--Background-->
            <!-- <img class="header-background"> -->

            <!--Name--> 
            <section class="header-name">Bila sowa</section>

            <!--Avatar-->
            <img class="header-avatar" src="./Images/Avatar.jpg" alt="avatar">
            
            <!--Views-->
            <div class="views-container">
                <a class="views-value">17</a>
                <i class="fa-solid fa-eye views"></i>
            </div>
            
        </div>

        <!--Social Links-->
        <div class="social-links-container">
            <!--Discord-->
            <a href="https://discord.gg/cJzwx7cg" target="_blank">
                <i class="fa-brands fa-discord icon" title="Discrod" alt="Discord"></i>
            </a>

            <!--Telegram-->
            <a href="https://t.me/Bila_sowa" target="_blank">
                <i class="fa-brands fa-telegram icon" title="Telegram" alt="Telegram"></i>
            </a>

            <!--GitHub-->
            <a href="https://github.com/Bila-sowa" target="_blank">
                <i class="fa-brands fa-github icon" title="GitHub" alt="GitHub"></i>
            </a>

            <!--SoundCloud-->
            <a href="https://soundcloud.com/bila_sowa" target="_blank">
                <i class="fa-brands fa-soundcloud icon" title="SoundCloud" alt="SoundCloud"></i>
            </a>

            <!--Steam-->
            <a href="https://steamcommunity.com/profiles/76561199189650296/" target="_blank">
                <i class="fa-brands fa-steam icon" title="Steam" alt="Steam"></i>
            </a>
        </div>
        
        <!--Player-->
        <div class="player">
            <!--Now playing-->
            <p class="player-np">Now playing</p>
            <!--Track Icon-->
            <img class="track-icon" src="./Images/PlayerImage.jpg" alt="Track Icon">

            <!--Name-->
            <a class="track-name" target="_blank" title="Link to SoundCloud"></a>


            <!--Functional-->
            <div class="functional">

                <!--Buttons-->
                <div class="buttons">
                    <i class="fa-solid fa-play button button-play" title="Play"></i>
                </div>
                
                <!-- sliders -->
                <div class="sliders">
                    <!--Volume-slider-->
                    <!-- <i class="fa-solid fa-volume-high volume-icon"></i> -->
                    <input type="range" min="0" max="100" value="20" class="volume-slider">
                    <!--time slider-->
                    <input type="range" min="0" max="100" value="0" class="time-slider">
                </div>
                <span class="track-time">0:00</span>
                <audio class="audio-player" preload="metadata"></audio>
            </div>  
        </div>  
    </div>
</body>
</html>
