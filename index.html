<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!--Name && Icon-->
    <title>My Digital Presence</title>
    <link rel="icon" href="./Images/Logo/Deagle.png">

    <!--Styles-->
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

</head>
<body>
<!-- <div>
        Blur button click
        <button>Click</button>
    </div> -->

    <!--Core app -->
    <div class="app">   
        <!--Header-->
        <div class="header">
            <!--Background-->
            <!-- <img class="header-background"> -->

            <!--Name-->
            <section class="header-name">Bila sowa</section>

            <!--Avatar-->
            <img class="header-avatar" src="./Images/Avatar.jpg" alt="avatar">
            
            <!--Views-->
            <div class="views-container">
                <a class="views-value">0</a>
                <i class="fa-solid fa-eye views"></i>
            </div>
            
        </div>

        <!--Social Links-->
        <div class="social-links-container">
            <!--Discord-->
            <a href="https://discord.gg/cJzwx7cg" target="_blank">
                <i class="fa-brands fa-discord icon"></i>
            </a>

            <!--Telegram-->
            <a href="https://t.me/Bila_sowa" target="_blank">
                <i class="fa-brands fa-telegram icon"></i>
            </a>

            <!--GitHub-->
            <a href="https://github.com/Bila-sowa" target="_blank">
                <i class="fa-brands fa-github icon"></i>
            </a>

            <!--SoundCloud-->
            <a href="https://soundcloud.com/bila_sowa" target="_blank">
                <i class="fa-brands fa-soundcloud icon"></i>
            </a>

            <!--Steam-->
            <a href="https://steamcommunity.com/profiles/76561199189650296/" target="_blank">
                <i class="fa-brands fa-steam icon"></i>
            </a>
        </div>
        

        <!--Player-->
        <div class="player">
            <!--Now playing-->
            <p class="player-np">Now playing</p>
            <!--Track Icon-->
            <img class="track-icon" src="./Images/PlayerImage.jpg">

            <!--Name-->
            <a class="track-name" href="https://soundcloud.com/semataryy/09-sematary-buryd-my-heart" target="_blank">SEMATARY - BURYD MY HEART</a>


            <!--Functional-->
            <div class="functional">

                <!--Buttons-->
                <div class="buttons">
                
                    <!-- Previous -->
                    <i class="fa-solid fa-backward button"></i>
                
                    <!-- Play -->   <!--class="fa-solid fa-pause"-->
                    <i class="fa-solid fa-play button"></i>

                    <!-- Next -->
                    <i class="fa-solid fa-forward button"></i>
                </div>
                
                <!-- sliders -->
                <div class="sliders">
                    <!--Volume-slider-->
                    <i class="fa-solid fa-volume-high volume-icon"></i>
                    <input type="range" min="0" max="100" value="30" class="volume-slider">
                    <!--time slider-->
                    <input type="range" min="0" max="100" value="0" class="time-slider">
                </div>
                <span class="track-time">3:53</span>
                  
                


            </div>  
        </div>  
    </div>
</body>
</html>
